<li class="post-item">
  <a class="post-item__link" href="{{ include.post.url | relative_url }}">
    <span class="post-item__meta">
      <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%-d %b %Y' }}</time>
      {%- if include.post.series and site.series[include.post.series] %} · Part {{ include.post.part }}{% endif %}
    </span>
    <span class="post-item__title">{{ include.post.title }}</span>
    {%- if include.post.description %}
    <span class="post-item__desc">{{ include.post.description }}</span>
    {%- endif %}
  </a>
</li>
