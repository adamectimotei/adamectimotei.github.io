# ------------------------------------------------------------------
# Site identity
# ------------------------------------------------------------------
title: Timotei Adamec
tagline: Notes from security research
description: >-
  Penetration tester and security researcher. Notes on research,
  the tools I build for engagements, and what I learn along the way.
author:
  name: Timotei Adamec
  github: adamectimotei
  linkedin: timotei-adamec

# Used by jekyll-seo-tag for search engines and link previews.
social:
  name: Timotei Adamec
  links:
    - https://github.com/adamectimotei
    - https://www.linkedin.com/in/timotei-adamec/

url: "https://adamectimotei.github.io"
baseurl: ""
lang: en

# Navigation shown in the header, in this order.
nav:
  - title: Writing
    url: /

# Post series. A post joins a series with `series: masking` in its
# front matter and its position with `part: 1`.
series:
  masking:
    title: Masking pentest data for AI
    description: >-
      How to detect and mask client data in pentest traffic before it
      reaches an AI provider, layer by layer.

# ------------------------------------------------------------------
# Build
# ------------------------------------------------------------------
# No theme: the layouts, includes and CSS in this repository are the
# whole design. All plugins below are built into GitHub Pages.
plugins:
  - jekyll-seo-tag   # titles, descriptions, link previews
  - jekyll-sitemap   # sitemap.xml for search engines

permalink: /:year/:month/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: drafts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
